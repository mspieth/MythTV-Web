RewriteEngine On
RewriteCond %{HTTPS} !=on
RewriteRule ^/?mythtv-web/?(.*)$ https://mythtv.example.com/mythtv-web/$1 [R=301,L,NE]
RewriteRule ^/?mythtv-web$ /mythtv-web/ [R=301,L]

ProxyRequests Off
<Location /mythtv-web/>
    ProxyPass http://127.0.0.1:6555/
    ProxyPassReverse http://127.0.0.1:6555/
    ProxyPassReverseCookiePath / /mythtv-web/
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Prefix "/mythtv-web"
</Location>

<Proxy "http://127.0.0.1:6555/*">
    Require all granted
</Proxy>
